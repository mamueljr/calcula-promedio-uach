<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Calculadora de Calificación Final</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f0f8ff;
        color: #333;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      .container {
        background: white;
        border-radius: 15px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        padding: 30px;
        width: 90%;
        max-width: 400px;
        text-align: center;
        margin: auto;
      }

      h1 {
        font-size: 1.5rem;
        margin-bottom: 20px;
      }

      label {
        display: block;
        margin: 10px 0 5px;
        font-weight: bold;
      }

      input[type="number"] {
        width: 100%;
        padding: 10px;
        border-radius: 10px;
        border: 1px solid #ccc;
        margin-bottom: 15px;
        font-size: 1rem;
      }

      button {
        background-color: #89cff0;
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 10px;
        font-size: 1rem;
        cursor: pointer;
        transition: background-color 0.3s;
      }

      button:hover {
        background-color: #67b7e1;
      }

      #resultado {
        margin-top: 20px;
        font-size: 1.2rem;
        font-weight: bold;
        color: #007700;
      }

      footer {
        text-align: center;
        padding: 15px;
        background-color: #d3d3d3;
        font-size: 0.9rem;
      }

      footer a {
        color: #333;
        text-decoration: none;
        font-weight: bold;
      }

      footer a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Calculadora de Calificación Final UACH</h1>
      <h3>Hecho por M.I.C Emmanuel Rojas</h3>
      <label for="parcial1">Parcial 1 (30%)</label>
      <input type="number" id="parcial1" min="0" max="100" step="0.01" />

      <label for="parcial2">Parcial 2 (30%)</label>
      <input type="number" id="parcial2" min="0" max="100" step="0.01" />

      <label for="parcial3">Parcial 3 (40%)</label>
      <input type="number" id="parcial3" min="0" max="100" step="0.01" />

      <button onclick="calcular()">Calcular</button>

      <div id="resultado"></div>
    </div>

    <footer>
      <p>
        <a href="https://mamueljr.github.io/esiscom/" target="_blank"
          >ESISCOM</a
        >
        2025
      </p>
    </footer>

    <script>
      function calcular() {
        const p1 = parseFloat(document.getElementById("parcial1").value) || 0;
        const p2 = parseFloat(document.getElementById("parcial2").value) || 0;
        const p3 = parseFloat(document.getElementById("parcial3").value) || 0;

        const final = p1 * 0.3 + p2 * 0.3 + p3 * 0.4;
        document.getElementById(
          "resultado"
        ).innerText = `Calificación final: ${final.toFixed(2)}`;
      }
    </script>
  </body>
</html>
